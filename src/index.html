<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mean Unicorns Sing In Chiptune by Len.icon</title>
    <link rel="stylesheet" href="style.css"></link>
</head>

<body>
    <div id="valleyBg" aria-hidden="true">
        <div id="sky"></div>
        <div id="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
        <div id="hillsBack"></div>
        <div id="hillsFront"></div>
    </div>
    <div id="crtOverlay" aria-hidden="true"></div>
    <div id="startOverlay">
        <div id="menuPanel">
            <div id="menuTitle"><span class="I">M</span>ean <span class="I">U</span>nicorns <span class="I">S</span>ing
                <span class="I">I</span>n <span class="I">C</span>hiptune
                <div id="menuBy">by Len.icon</div>
            </div>
            <div class="menu-divider"></div>
            <div id="menuTagline">For js13kGame Jam</div>

            <div id="songPicker">
                <span class="song-label">SELECT SONG</span>
                <div class="song-selector-controls">
                    <button id="prevSongBtn" class="arrow-btn">&lt;</button>
                    <span id="songTitle">Song Name</span>
                    <button id="nextSongBtn" class="arrow-btn">&gt;</button>
                </div>
            </div>

            <div id="menuControls">
                <div><span>Move</span><span class="key">
                    <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> / <kbd>↑</kbd> <kbd>←</kbd> <kbd>↓</kbd> <kbd>→</kbd>
                </span></div>
                <div><span>Switch Song</span><span class="key"><kbd>W</kbd> <kbd>D</kbd> / <kbd>←</kbd> <kbd>→</kbd></span></div>
                <div><span>START / Restart</span><span class="key"><kbd>Enter</kbd></span></div>
                <div><span>Main Menu</span><span class="key"><kbd>M</kbd></span></div>
            </div><button id="startBtn">Ride The Unicorn</button>
        </div>
    </div>
    <div id="hud">
        <div id="hudSong"><span id="hudSongTitle">Song Name</span></div>
        <div id="hudStats">
            <div id="floatScore">Score: <span id="score">0</span></div>
            <div>Time: <span id="timeVal">0.0</span>s</div>
            <div id="hearts"></div>
        </div>
    </div>
    <div id="unicornWrap"><canvas id="unicornCanvas"></canvas></div>
    <div id="grid"></div>
    <div id="msg">Arrow keys / WASD to move</div>
    <div id="gameButtons">
        <button id="restart">ENTER to Restart</button>
        <button id="menuBtn">M for Main Menu</button>
    </div>
    
    <script src="js/inputs/keyboard.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/const.js"></script>
    
    <script src="js/music/songs/one.js"></script>
    <script src="js/music/songs/two.js"></script>
    <script src="js/music/songs/three.js"></script>
    <script src="js/music/songs/four.js"></script>
    <script src="js/music/songs/five.js"></script>
    <script src="js/music/songs/six.js"></script>

    <script src="js/music/song.js"></script>
    <script src="js/music/audio.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
