<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Mean Unicorns Sing In Chiptune by Len.icon</title>
    <script src="./stages.js"></script>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      body{
        background:#0b0620;color:#fff;
        background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 4px);
        font-family:'Courier New',monospace;font-weight:bold;text-transform:uppercase;letter-spacing:1px;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        min-height:100vh;overflow:hidden;user-select:none;image-rendering:pixelated
      }
      @keyframes shake{
        0%,100%{transform:translate(0,0)}
        20%{transform:translate(-6px,-5px)}
        40%{transform:translate(6px,5px)}
        60%{transform:translate(-5px,6px)}
        80%{transform:translate(5px,-6px)}
      }
      body.shake{animation:shake .4s ease-in-out}
      #hud{
        font-size:15px;margin:10px 0;display:flex;gap:18px;background:#1a1030;
        border:3px solid #000;box-shadow:4px 4px 0 #000;padding:6px 14px;text-shadow:2px 2px 0 #000
      }
      #floatScore{ position: relative; display: inline-block; }
      @keyframes floatScore {
        0% { opacity: 1; transform: translateY(0) scale(1); }
        100% { opacity: 0; transform: translateY(-28px) scale(1.25); }
      }
      .score-pop{
        position: absolute; right: 0; top: -12px; color: #ff4dff; font-size: 15px;
        text-shadow: 2px 2px 0 #000; pointer-events: none; animation: floatScore 0.8s ease-out forwards;
        white-space: nowrap; z-index: 10;
      }
      .score-pop.clutch-pop {
        color: #3dff5c; font-size: 17px;
      }
      #stageTag{font-size:14px;opacity:.8}
      #unicornWrap{margin-bottom:8px;transition:transform .12s}
      #unicornWrap.blast{transform:scale(1.25) rotate(-6deg)}
      #grid{
        position:relative;
        display:grid;grid-template-columns:repeat(5,60px);grid-template-rows:repeat(5,60px);
        gap:4px;background:#1a1030;padding:6px;border:3px solid #000;box-shadow:6px 6px 0 #000
      }
      .cell{
        width:60px;height:60px;background:#241a3d;border:2px solid #000;
        position:relative;overflow:hidden
      }
      .cd{
        position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        font-size:22px;color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;
        pointer-events:none
      }
      .warn{
        background:repeating-linear-gradient(45deg,#ffd23f70 0 10px,#241a3d70 10px 20px);
      }
      @keyframes fireFlash{0%{filter:brightness(1.8)}100%{filter:brightness(1)}}
      .fire{
        background:repeating-linear-gradient(45deg,#ff004d 0 10px,#ff9d00 10px 20px,#fff700 20px 30px,#3dff5c 30px 40px,#00e5ff 40px 50px,#7b2fff 50px 60px) !important;
        animation:fireFlash .15s ease-out
      }
      #playerCanvas{position:absolute;pointer-events:none;image-rendering:pixelated;transition:left .1s,top .1s}
      #uniFly{position:absolute;pointer-events:none;image-rendering:pixelated;z-index:5;
        transition:left .6s ease-in-out,top .6s ease-in-out,opacity .5s ease-in-out}
      #msg{margin-top:14px;font-size:14px;min-height:20px;text-align:center;text-shadow:2px 2px 0 #000;transition:color .15s}
      #msg.clutch{color:#3dff5c}
      #restart{
        margin-top:10px;padding:8px 18px;font-size:13px;font-family:inherit;font-weight:bold;text-transform:uppercase;
        border:3px solid #000;background:#ff4dff;color:#fff;cursor:pointer;box-shadow:4px 4px 0 #000;display:none
      }
      #restart:active{box-shadow:2px 2px 0 #000;transform:translate(2px,2px)}
      #hearts{display:flex;gap:4px;align-items:center}
      .heart{width:14px;height:14px;background:#ff004d;border:2px solid #000}
      .heart.lost{background:#332244}
      #startOverlay {
        position: fixed;
        inset: 0;
        background: rgba(11, 6, 32, 0.85);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999;
      }
      #startBtn {
        padding: 14px 28px;
        font-size: 18px;
        font-family: inherit;
        font-weight: bold;
        text-transform: uppercase;
        border: 3px solid #000;
        background: #ff4dff;
        color: #fff;
        cursor: pointer;
        box-shadow: 5px 5px 0 #000;
        margin-top: 15px;
      }
      #startBtn:active {
        box-shadow: 2px 2px 0 #000;
        transform: translate(3px, 3px);
      }
      .I {text-decoration: underline;}
    </style>
  </head>
  <body>

    <div id="startOverlay">
      <div style="font-size:20px; text-shadow:2px 2px 0 #000; margin-bottom:10px;">
        <span class="I">M</span>ean <span class="I">U</span>nicorns <span class="I">S</span>ing <span class="I">I</span>n <span class="I">C</span>hiptune by Len.icon</div>
      <button id="startBtn">RIDE THE UNICORN</button>
    </div>

    <div id="hud">
      <div id="floatScore">Score: <span id="score">0</span></div>
      <div>Time: <span id="timeVal">0.0</span>s</div>
      <div id="hearts"></div>
      <div id="stageTag">Stage <span id="stageNum">1</span></div>
    </div>
    <div id="unicornWrap"><canvas id="unicornCanvas"></canvas></div>
    <div id="grid"></div>
    <div id="msg">Arrow keys / WASD to move</div>
    <button id="restart">ENTER to Restart</button>

    <audio id="bgm"></audio>

    <script>
      const GAME_DURATION_SECONDS = 200;
      const WARN_BEATS = 1;
      const CLUTCH_BONUS = 15;
      const MUSIC_URL = './hexxel-tampered-532260.mp3';

      const PEW_URL = './pew.mp3';
      const pewAudio = new Audio(PEW_URL);
      function pew(){ pewAudio.cloneNode().play(); }

      const GIRL_BMP = ["...BBB..","...BSS..","..BBSSB.","..BBKBB.","...KKK..","..KKKKK.","...F.F.."];
      const GIRL_PAL = {K:'#f3be00',S:'#ffe5cc',B:'#8f563b', F:'#ac3232'};
      const UNI_BMP = ["H........","HH...R..",".HPP.OO.",".SSP..YY",".SSPPCGG","..SSSPC.","..SSSS..","..S..S.."];
      const UNI_PAL = {H:"#f5d151",P:"#d77bba",S:"#ffe1f6",R:'#ff004d',O:'#ff9d00',Y:'#fff700',G:'#3dff5c',C:'#00e5ff'};

      function drawSprite(canvas, bmp, palette, px, flipX = false){
        canvas.width = bmp[0].length*px;
        canvas.height = bmp.length*px;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        bmp.forEach((row,y)=>{
          [...row].forEach((ch,x)=>{
            if(ch==='.') return;
            ctx.fillStyle = palette[ch];
            const drawX = flipX ? (bmp[0].length - 1 - x) : x;
            ctx.fillRect(drawX*px, y*px, px, px);
          });
        });
      }

      const N = 5, CELL = 60, GAP = 4, PAD = 6, PLAYER_PX = 6, UNI_PX = 5;
      const GRID_W = PAD*2 + N*CELL + (N-1)*GAP;
      const UNI_DOCK_LEFT = (GRID_W - UNI_BMP[0].length*UNI_PX) / 2;
      const UNI_DOCK_TOP = -60;

      const hud = document.getElementById('hud');
      const gridEl = document.getElementById('grid');
      const scoreEl = document.getElementById('score');
      const timeValEl = document.getElementById('timeVal');
      const heartsEl = document.getElementById('hearts');
      const stageNumEl = document.getElementById('stageNum');
      const msgEl = document.getElementById('msg');
      const restartBtn = document.getElementById('restart');
      const unicornWrap = document.getElementById('unicornWrap');
      const startOverlay = document.getElementById('startOverlay');
      const startBtn = document.getElementById('startBtn');
      const bgm = document.getElementById('bgm');
      const unicornCanvas = document.getElementById('unicornCanvas');
      const DEFAULT_MSG = 'Arrow keys / WASD to move';

      if (MUSIC_URL) { bgm.src = MUSIC_URL; }

      let cells = [];
      let player = {r:4, c:2, facingLeft:false};
      let lives = 3;
      let score = 0;
      let pending = [];
      let running = false;
      let gameStarted = false;
      let introDone = false;
      let timer = null;
      let clockTimer = null;
      let audioCtx = null;
      let playerCanvas;
      let uniFlyCanvas;
      let startTime = 0;
      let currentStageIdx = -1;
      let stageBeatCounter = 0;
      let canMove = true;

      function popScore(pts, isClutch = false) {
        const floatScore = document.getElementById('floatScore');
        if (!floatScore) return;
        const pop = document.createElement('div');
        pop.className = 'score-pop' + (isClutch ? ' clutch-pop' : '');
        pop.textContent = '+' + pts;
        if (isClutch) pop.style.marginRight = (Math.random() * 20 - 10) + 'px';
        floatScore.appendChild(pop);
        setTimeout(() => pop.remove(), 800);
      }

      function buildGrid(){
        gridEl.innerHTML = '';
        cells = [];
        for(let r=0;r<N;r++){
          let row = [];
          for(let c=0;c<N;c++){
            const div = document.createElement('div');
            div.className = 'cell';
            const cd = document.createElement('span');
            cd.className = 'cd';
            div.appendChild(cd);
            gridEl.appendChild(div);
            row.push(div);
          }
          cells.push(row);
        }
        playerCanvas = document.createElement('canvas');
        playerCanvas.id = 'playerCanvas';
        gridEl.appendChild(playerCanvas);
        drawSprite(playerCanvas, GIRL_BMP, GIRL_PAL, PLAYER_PX);

        uniFlyCanvas = document.createElement('canvas');
        uniFlyCanvas.id = 'uniFly';
        gridEl.appendChild(uniFlyCanvas);
        drawSprite(uniFlyCanvas, UNI_BMP, UNI_PAL, UNI_PX);

        drawSprite(unicornCanvas, UNI_BMP, UNI_PAL, UNI_PX);
        heartsEl.innerHTML = '';
        for(let i=0;i<3;i++){
          const h = document.createElement('span');
          h.className = 'heart';
          heartsEl.appendChild(h);
        }
        setupIntro();
      }

      function setupIntro(){
        hud.style.display = 'none';
        introDone = false;
        player = {r:4, c:2, facingLeft:false};
        unicornWrap.style.display = 'none';
        uniFlyCanvas.style.transition = 'none';
        uniFlyCanvas.style.opacity = '1';
        positionUniFlyAt(0, 2);
        void uniFlyCanvas.offsetWidth;
        uniFlyCanvas.style.transition = '';
        drawPlayer();
      }

      function setupGameplay(){
        introDone = true;
        player = {r:2, c:2, facingLeft:false};
        unicornWrap.style.display = '';
        drawSprite(unicornCanvas, UNI_BMP, UNI_PAL, UNI_PX);
        uniFlyCanvas.style.transition = 'none';
        uniFlyCanvas.style.opacity = '0';
        void uniFlyCanvas.offsetWidth;
        uniFlyCanvas.style.transition = '';
        drawPlayer();
      }

      function positionUniFlyAt(r, c){
        uniFlyCanvas.style.left = (PAD + c*(CELL+GAP) + (CELL-uniFlyCanvas.width)/2) + 'px';
        uniFlyCanvas.style.top  = (PAD + r*(CELL+GAP) + (CELL-uniFlyCanvas.height)/2) + 'px';
      }

      function screenshake(d){
        document.body.classList.add('shake');
        setTimeout(()=> document.body.classList.remove('shake'), d);
      }
      
      function triggerIntroFlyOut(){
        introDone = true;
        launchGame();
        screenshake(400);
        uniFlyCanvas.style.left = UNI_DOCK_LEFT + 'px';
        uniFlyCanvas.style.top = UNI_DOCK_TOP + 'px';
        setTimeout(()=>{
          uniFlyCanvas.style.opacity = '0';
          unicornWrap.style.display = '';
          drawUnicorn();
          hud.style.display = 'flex';
        }, 650);
      }

      function playOutro(){
        unicornWrap.style.display = 'none';
        uniFlyCanvas.style.transition = 'none';
        uniFlyCanvas.style.left = UNI_DOCK_LEFT + 'px';
        uniFlyCanvas.style.top = UNI_DOCK_TOP + 'px';
        uniFlyCanvas.style.opacity = '1';
        void uniFlyCanvas.offsetWidth;
        uniFlyCanvas.style.transition = '';
        positionUniFlyAt(1, 2);
        player.r = 2; player.c = 2; player.facingLeft = false;
        drawPlayer();
      }

      function drawUnicorn(){
        if (player.c > 2) drawSprite(unicornCanvas, UNI_BMP, UNI_PAL, UNI_PX, true);
        else if (player.c <= 1) drawSprite(unicornCanvas, UNI_BMP, UNI_PAL, UNI_PX, false);
      }

      function drawPlayer(){
        const left = PAD + player.c*(CELL+GAP) + (CELL-playerCanvas.width)/2;
        const top  = PAD + player.r*(CELL+GAP) + (CELL-playerCanvas.height)/2;
        drawSprite(playerCanvas, GIRL_BMP, GIRL_PAL, PLAYER_PX, player.facingLeft)
        playerCanvas.style.left = left+'px';
        playerCanvas.style.top = top+'px';
        drawUnicorn();
      }

      function keyToPattern(p){
        const list = [];
        const toArr = (val) => Array.isArray(val) ? val : (val !== undefined ? [val] : []);
        if(p.t==='row'){ const rows=toArr(p.i??p.r); rows.forEach(r=>{ for(let c=0;c<N;c++) list.push([r,c]); }); }
        else if(p.t==='col'){ const cols=toArr(p.i??p.c); cols.forEach(c=>{ for(let r=0;r<N;r++) list.push([r,c]); }); }
        else if(p.t==='cross'){ const rows=toArr(p.r); const cols=toArr(p.c); rows.forEach(r=>{ for(let c=0;c<N;c++) list.push([r,c]); }); cols.forEach(c=>{ for(let r=0;r<N;r++) list.push([r,c]); }); }
        else if(p.t==='area'){ const rows=toArr(p.r); const cols=toArr(p.c); rows.forEach(r=>{ cols.forEach(c=>{ list.push([r, c]); })}); }
        else if(p.t==='corners'){ list.push([0,0],[0,4],[4,0],[4,4]); }
        else if(p.t==='center'){ list.push([2,2]); }
        else if(p.t==='checker'){ for(let r=0;r<N;r++) for(let c=0;c<N;c++){ if(((r+c)%2===0) === !!p.odd) list.push([r,c]); }}
        else if(p.t==='dots'){ const cells=toArr(p.i); for(let c=0;c<cells.length;c++){ list.push([ Math.floor(cells[c]/N), Math.floor(cells[c]%N) ]) } }
        else if(p.t==='random'){ list.push(...keyToPattern({t:"dots", i:Array.from({ length: 25 }, (_, i) => i).sort(() => Math.random() - 0.5).slice(0, p.i)})); }
        else if(p.t==='pos'){ list.push([player.r, player.c]); }
        return list;
      }

      function initAudio(){
        if(!audioCtx){
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if(audioCtx.state === 'suspended'){
          audioCtx.resume();
        }
      }

      function flashMsg(text, cls, revertTo){
        msgEl.textContent = text;
        if(cls) msgEl.classList.add(cls);
        setTimeout(()=>{
          if(cls) msgEl.classList.remove(cls);
          if(running) msgEl.textContent = revertTo;
        }, 650);
      }

      function elapsedSeconds(){
        return (Date.now() - startTime) / 1000;
      }

      function stageForTime(t){
        let idx = 0;
        for(let i=0;i<STAGES.length;i++){ if(t >= STAGES[i].start) idx = i; }
        return idx;
      }

      function updateCellVisuals(){
        const elapsed = elapsedSeconds();
        const activeWarnings = new Map();

        pending.forEach(p => {
          const remSec = Math.max(0, p.fireTime - elapsed);
          p.cells.forEach(([r, c]) => {
            const key = `${r},${c}`;
            if (!activeWarnings.has(key) || remSec < activeWarnings.get(key)) {
              activeWarnings.set(key, remSec);
            }
          });
        });

        for(let r = 0; r < N; r++){
          for(let c = 0; c < N; c++){
            const cell = cells[r][c];
            const key = `${r},${c}`;
            if(!cell.classList.contains('fire')){
              if(activeWarnings.has(key)){
                const remSec = activeWarnings.get(key);
                const displayCd = Math.ceil(remSec);

                cell.classList.add('warn');
                cell.querySelector('.cd').textContent = displayCd;

                let color = '#ffd23f70';
                if (remSec <= 1.2 && remSec > 0.6) color = '#ff9d0070';
                if (remSec <= 0.6) color = '#ff004d70';

                cell.style.background = `repeating-linear-gradient(45deg, ${color} 0 10px, #241a3d70 10px 20px)`;
              } else {
                cell.classList.remove('warn');
                cell.style.background = '';
                cell.querySelector('.cd').textContent = '';
              }
            } else {
              cell.style.background = '';
            }
          }
        }
      }

      function checkLastSecondDodges(){
        const now = elapsedSeconds();
        pending.forEach(p=>{
          if(p.lastSecond) return;
          const remaining = p.fireTime - now;
          const window = Math.min(1.0, (p.warnDuration || 1) * 0.2);
          if(remaining > 0 && remaining <= window){
            if(p.cells.some(([r,c])=> player.r===r && player.c===c)) p.lastSecond = true;
          }
        });
      }

      function tick(){
        if(!running) return;
        const elapsed = elapsedSeconds();
        if(elapsed >= GAME_DURATION_SECONDS){ endGame(true); return; }

        const stageIdx = stageForTime(elapsed);
        if(stageIdx !== currentStageIdx){ currentStageIdx = stageIdx; stageBeatCounter = 0; }
        const stage = STAGES[stageIdx];
        const bpm = stage.bpm;
        stageNumEl.textContent = stageIdx+1;
        
        if (!stage.patterns || stage.patterns.length === 0) { clearCells(); timer = setTimeout(tick, 60000 / bpm); return; }

        const pattern = stage.patterns[stageBeatCounter % stage.patterns.length];
        stageBeatCounter++;
        checkLastSecondDodges();

        let firingGroups = [];
        pending = pending.filter(p=>{
          const remaining = p.fireTime - elapsed;
          if(remaining <= 0.05){
            firingGroups.push(p);
            return false;
          }
          return true;
        });

        let hit = false;
        let clutch = false;
        firingGroups.forEach(group=>{
          let groupHit = false;
          group.cells.forEach(([r,c])=>{
            const cell = cells[r][c];
            cell.classList.remove('warn');
            cell.style.background = '';
            cell.querySelector('.cd').textContent = '';
            cell.classList.add('fire');
            if(player.r===r && player.c===c) groupHit = true;
          });
          if(groupHit){
            screenshake(200);
            hit = true;
          }
          else {
            const pts = (10 + (5 * (lives-1))); 
            score += pts;
            popScore(pts);
            if(group.lastSecond) { 
              score += CLUTCH_BONUS; clutch = true;
              setTimeout(() => popScore(CLUTCH_BONUS, true), 150);
            }
          }
        });

        if(firingGroups.length){
          pew();
          unicornWrap.classList.add('blast');
          setTimeout(()=>unicornWrap.classList.remove('blast'), 150);
          const allFiring = firingGroups.flatMap(g=>g.cells);
          const clearDelay = Math.min(300, (60000/bpm)*0.5);
          setTimeout(()=>{ 
            allFiring.forEach(([r,c])=> {
              cells[r][c].classList.remove('fire');
              cells[r][c].style.background = '';
            }); 
            updateCellVisuals();
          }, clearDelay);
        }

        scoreEl.textContent = score;

        if(hit){
          lives--;
          const hearts = [...heartsEl.children];
          hearts.forEach((h,i)=> h.classList.toggle('lost', i>=lives));
          if(lives<=0){ endGame(false); return; }
        } else if(clutch){
          flashMsg('+' + CLUTCH_BONUS + ' CLUTCH DODGE!', 'clutch', DEFAULT_MSG);
        }

        const warnDurationSeconds = WARN_BEATS * (60 / bpm);
        pending.push({
          cells: keyToPattern(pattern), 
          fireTime: elapsed + warnDurationSeconds, 
          warnDuration: warnDurationSeconds,
          lastSecond: false
        });

        updateCellVisuals();

        drawPlayer();
        timer = setTimeout(tick, 60000/bpm);
      }

      function updateClock(){
        if(!running) return;
        timeValEl.textContent = Math.min(elapsedSeconds(), GAME_DURATION_SECONDS).toFixed(1);
        checkLastSecondDodges();
        updateCellVisuals();
      }

      function clearCells(){
        cells.forEach(row=>row.forEach(cell=>{
          cell.classList.remove('fire','warn');
          cell.style.background = '';
          cell.querySelector('.cd').textContent = '';
        }));
      }

      function endGame(survived){
        clearCells();
        canMove = false;
        running = false;
        clearTimeout(timer);
        clearInterval(clockTimer);
        timeValEl.textContent = Math.min(elapsedSeconds(), GAME_DURATION_SECONDS).toFixed(1);
        msgEl.classList.remove('clutch');
        const label = survived ? 'Unicorn Likes You!' : 'Game Over';
        msgEl.textContent = label + ' — Score: ' + score + '  Time: ' + timeValEl.textContent + 's';
        restartBtn.style.display = 'inline-block';
        if(survived) playOutro();
        else bgm.pause();
      }

      function resetGame(){
        canMove = true;
        clearTimeout(timer);
        clearInterval(clockTimer);
        pending = [];
        score = 0;
        lives = 3;
        currentStageIdx = -1;
        stageBeatCounter = 0;
        running = false;
        scoreEl.textContent = '0';
        timeValEl.textContent = '0.0';
        stageNumEl.textContent = '1';
        msgEl.classList.remove('clutch');
        msgEl.textContent = DEFAULT_MSG;
        restartBtn.style.display = 'none';
        clearCells();
        heartsEl.innerHTML = '';
        for(let i=0;i<3;i++){
          const h = document.createElement('span');
          h.className = 'heart';
          heartsEl.appendChild(h);
        }
        setupGameplay();
        bgm.pause();
        bgm.currentTime = 0;
        launchGame();
      }

      function move(dr, dc){
        if(!gameStarted || !canMove) return;
        const nr = player.r + dr, nc = player.c + dc;
        if(nr<0||nr>=N||nc<0||nc>=N) return;
        player.r = nr; player.c = nc;
        if (dc < 0) player.facingLeft = true;
        if (dc > 0) player.facingLeft = false;
        drawPlayer();
        if(!introDone && [0,1].includes(player.r) && [1,2,3].includes(player.c)){ triggerIntroFlyOut(); }
      }

      function dismissOverlay(){
        if(gameStarted) return;
        gameStarted = true;
        initAudio();
        startOverlay.style.display = 'none';
      }

      function launchGame(){
        if(running) return;
        running = true;
        initAudio();
        startTime = Date.now();
        if(MUSIC_URL){ bgm.play().catch(e=>console.error("Audio play failed:", e)); }
        clockTimer = setInterval(updateClock, 100);
        timer = setTimeout(tick, 60000/STAGES[0].bpm);
      }

      window.addEventListener('keydown', e=>{
        const k = e.key.toLowerCase();
        if(k==='enter'){
          e.preventDefault();
          if(!running && gameStarted) resetGame();
          return;
        }
        if(!gameStarted){
          if(['arrowup','w','arrowdown','s','arrowleft','a','arrowright','d',' '].includes(k)){
            dismissOverlay();
          } else {
            return;
          }
        }
        if(k==='arrowup'||k==='w') move(-1,0);
        else if(k==='arrowdown'||k==='s') move(1,0);
        else if(k==='arrowleft'||k==='a') move(0,-1);
        else if(k==='arrowright'||k==='d') move(0,1);
        else return;
        e.preventDefault();
      });

      startBtn.addEventListener('click', dismissOverlay);
      restartBtn.addEventListener('click', resetGame);

      if(MUSIC_URL){ bgm.addEventListener('ended', ()=>{ if(running) endGame(true); }); }

      buildGrid();
    </script>
  </body>
</html>
